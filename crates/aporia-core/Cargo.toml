[package]
name = "aporia-core"
description = "Notebook model, Markdown, links, search, and arguments for Aporia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Parsing only: no CLI, no syntect, no onig. See docs/adr/0002-markdown-preview.md.
comrak = { version = "0.55", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.9"
ulid = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
