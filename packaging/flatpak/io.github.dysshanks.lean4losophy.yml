# Flatpak manifest for lean4losophy.
#
# Status: skeleton for Gate G1. The workspace builds the app, but this manifest
# has not been built in the development environment:
#   1. `flatpak-builder` is not installed here;
#   2. `cargo-sources.json` must be generated with flatpak-cargo-generator
#      against the final Cargo.lock.
# See packaging/README.md for the exact commands and the G1 checklist.
#
# The app ID is final (ADR-0003).

app-id: io.github.dysshanks.lean4losophy
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lean4losophy

finish-args:
  # Wayland first; X11 only through the fallback socket.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Network is requested only for the two allowlisted flows in ADR-0003: the
  # opt-in update check and the consented Lean toolchain download. Flatpak
  # permissions are static, so this cannot be dropped at runtime; it is
  # disclosed in the appdata and privacy statement.
  - --share=network
  # Notebook folders are chosen through the portal, so no broad filesystem
  # access is requested. Documents access is added only if the portal proves
  # insufficient during the G1 spike.
  - --talk-name=org.freedesktop.portal.Desktop
  - --filesystem=xdg-run/gvfsd

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lean4losophy/cargo

modules:
  # Generated by:
  #   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
  - cargo-sources.json

  - name: lean4losophy
    buildsystem: simple
    build-commands:
      - cargo build --release --frozen --workspace
      - install -Dm755 target/release/lean4losophy /app/bin/lean4losophy
      - install -Dm644 packaging/flatpak/io.github.dysshanks.lean4losophy.desktop
        /app/share/applications/io.github.dysshanks.lean4losophy.desktop
      - install -Dm644 packaging/flatpak/io.github.dysshanks.lean4losophy.metainfo.xml
        /app/share/metainfo/io.github.dysshanks.lean4losophy.metainfo.xml
    sources:
      - type: dir
        path: ../..
