# Flatpak manifest for Aporia.
#
# Status: skeleton for Gate G1. The app crate (crates/aporia) arrives in M1;
# until then this manifest documents the intended runtime, permissions, and
# build path. It is not buildable yet for two reasons, both expected at M0:
#   1. there is no `aporia` binary target to install;
#   2. `cargo-sources.json` must be generated with flatpak-cargo-generator
#      against the final Cargo.lock.
# See packaging/README.md for the exact commands and the G1 checklist.
#
# The app ID is temporary until the product name is fixed (ADR-0003).

app-id: io.github.aporia.Notebook
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: aporia

finish-args:
  # Wayland first; X11 only through the fallback socket.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Network is requested only for the two allowlisted flows in ADR-0003: the
  # opt-in update check and the consented Lean toolchain download. Flatpak
  # permissions are static, so this cannot be dropped at runtime; it is
  # disclosed in the appdata and privacy statement.
  - --share=network
  # Notebook folders are chosen through the portal, so no broad filesystem
  # access is requested. Documents access is added only if the portal proves
  # insufficient during the G1 spike.
  - --talk-name=org.freedesktop.portal.Desktop
  - --filesystem=xdg-run/gvfsd

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/aporia/cargo

modules:
  # Generated by:
  #   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
  - cargo-sources.json

  - name: aporia
    buildsystem: simple
    build-commands:
      - cargo build --release --frozen --workspace
      - install -Dm755 target/release/aporia /app/bin/aporia
      - install -Dm644 packaging/flatpak/io.github.aporia.Notebook.desktop
        /app/share/applications/io.github.aporia.Notebook.desktop
      - install -Dm644 packaging/flatpak/io.github.aporia.Notebook.metainfo.xml
        /app/share/metainfo/io.github.aporia.Notebook.metainfo.xml
    sources:
      - type: dir
        path: ../..
